<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תודה | שילה ליאטו</title>
<meta name="robots" content="noindex">

<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="shortcut icon" href="favicon.ico?v=3">

<style>
  :root{
    --bg:#071c30;
    --bg2:#0a2540;
    --card:#0f2f4d;
    --card-border:#1d4569;
    --text:#eaf4fb;
    --text-dim:#9dc0dc;
    --accent:#ffffff;
    --accent-dark:#dbe9f5;
    --accent-glow: rgba(255,255,255,0.35);
    --accent-text:#071c30;
    --wa-green:#25D366;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{width:100%;overflow-x:hidden;}
  body{
    font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
    color:var(--text);
    line-height:1.6;
    min-height:100vh;
    width:100%;
    max-width:100vw;
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  .thanks-wrap{
    text-align:center;
    max-width:560px;
    width:100%;
  }
  .thanks-wrap h1{
    font-size:clamp(1.6rem, 4vw, 2.3rem);
    font-weight:800;
    line-height:1.4;
    margin-bottom:8px;
  }
  .thanks-wrap p.sub{
    color:var(--text-dim);
    font-size:1.05rem;
    margin-bottom:8px;
  }
  .thanks-photo{
    width:min(340px, 78vw);
    margin:8px auto 0;
    filter:drop-shadow(0 16px 34px rgba(0,0,0,0.5));
    animation:thanks-float 3.2s ease-in-out infinite;
  }
  .thanks-photo img{
    width:100%;height:auto;display:block;
  }
  @keyframes thanks-float{
    0%, 100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }
  .back-home{
    display:inline-block;margin-top:28px;
    background:var(--accent);color:var(--accent-text);font-weight:700;
    padding:12px 26px;border-radius:999px;text-decoration:none;font-size:0.95rem;
    box-shadow:0 4px 20px var(--accent-glow);
    transition:transform .15s ease;
  }
  .back-home:hover{transform:translateY(-2px);}
</style>
</head>
<body>

<div class="thanks-wrap">
  <h1>תודה על האמון בנו,<br>מיד ניצור איתך קשר</h1>
  <p class="sub">קיבלנו את הפרטים שלך ונחזור אליך בהקדם.</p>
  <div class="thanks-photo">
    <img src="thank-you-photo.png" alt="שילה ליאטו">
  </div>
  <a href="index.html" class="back-home">חזרה לאתר</a>
</div>

</body>
</html>
